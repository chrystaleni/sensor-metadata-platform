name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_DATABASE_ENGINE: postgis
      DJANGO_SECRET_KEY: ci-only-development-key
      DJANGO_DEBUG: "False"
      POSTGRES_DB: sensor_metadata_test
      POSTGRES_USER: sensor_test
      POSTGRES_PASSWORD: ci-only-development-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      db:
        image: postgis/postgis:16-3.7
        env:
          POSTGRES_DB: sensor_metadata_test
          POSTGRES_USER: sensor_test
          POSTGRES_PASSWORD: ci-only-development-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sensor_test -d sensor_metadata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils libproj-dev gdal-bin libgdal-dev libgeos-dev

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run Django system check
        working-directory: backend
        run: python manage.py check

      - name: Apply Django migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

      - name: Set up Node for real browser integration validation
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser integration dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate full application in a fresh disposable PostGIS container
        env:
          POSTGIS_TEST_IMAGE: postgis/postgis:16-3.7
        run: PYTHON="$(command -v python)" bash scripts/validate_disposable.sh

      - name: Preserve disposable integration test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: disposable-platform-validation
          path: /tmp/sensor-phase3-validation.*
          if-no-files-found: ignore
          retention-days: 7

  frontend-tests-and-build:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
