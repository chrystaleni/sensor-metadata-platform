server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health/ { proxy_pass http://backend:8000; }
    location = /ready/ { proxy_pass http://backend:8000; }
    # The map library starts its worker from an ES module file (.mjs). nginx
    # has no default MIME type for .mjs, and browsers refuse to run a module
    # that is not served as JavaScript, which leaves the map basemap blank.
    location ~* \.mjs$ { default_type text/javascript; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
